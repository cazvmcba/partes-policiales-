<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Procesador de Partes Policiales</title>
    <style>
        body { font-family: sans-serif; background: #f8fafc; color: #0f172a; padding: 15px; margin: 0; }
        .card { background: white; padding: 15px; border-radius: 8px; border: 1px solid #cbd5e1; margin-bottom: 15px; }
        textarea { width: 100%; height: 180px; padding: 10px; border-radius: 6px; border: 1px solid #94a3b8; box-sizing: border-box; }
        button { background: #1e3a8a; color: white; border: none; padding: 12px; border-radius: 6px; width: 100%; font-weight: bold; margin-top: 10px; }
        .field { margin-bottom: 8px; background: #f1f5f9; padding: 8px; border-radius: 4px; font-size: 14px; }
        .label { font-size: 11px; font-weight: bold; color: #64748b; text-transform: uppercase; }
    </style>
</head>
<body>
    <h2>Procesador de Partes</h2>
    <div class="card">
        <textarea id="rawInput" placeholder="Pega el parte aquí..."></textarea>
        <button onclick="procesar()">PROCESAR RESEÑA</button>
    </div>
    <div class="card" id="output">
        <div class="label">Fecha / Hora</div><div class="field" id="rFecha">-</div>
        <div class="label">Ubicación</div><div class="field" id="rUbi">-</div>
        <div class="label">Delito / Modalidad</div><div class="field" id="rDelito">-</div>
        <div class="label">Involucrados</div><div class="field" id="rInvolucrados">-</div>
    </div>
    <script>
        function procesar() {
            const t = document.getElementById('rawInput').value;
            if(!t.trim()) return;
            const f = (t.match(/FECHA:\s*(\d{2}\/\d{2}\/\d{4})/i) || [])[1] || "-";
            const h = (t.match(/(\d{2}:\d{2})\s*hs/i) || [])[1] || "-";
            let d = (t.match(/DIRECCION DEL HECHO:\s*([^\n]+)/i) || [])[1] || (t.match(/\d{2}:\d{2}\s*hs\s*\/\s*([^\/\n-]+)/i) || [])[1] || "-";
            let b = (t.match(/BARRIO:\s*([^\n]+)/i) || [])[1] || (t.match(/B°\s*([^\/\n-]+)/i) || [])[1] || "";
            let del = (t.match(/DELITO O CONTRAVENCION:\s*([^\n]+)/i) || [])[1] || (t.match(/\*([^*]+)\*/g) || [])[1]?.replace(/\*/g,'') || "-";
            let mod = (t.match(/MODALIDAD:\s*([^\n]+)/i) || [])[1] || (t.match(/modalidad\s*“([^”"]+)”/i) || [])[1] || "";
            
            const m = [...t.matchAll(/([A-ZÁÉÍÓÚÑa-záéíóúñ\s]+)(?:\((\d{1,2})\)|,?\s*(\d{1,2})\s*AÑOS)/g)];
            let inv = m.map(x => `${x[1].replace(/Aprehendido|traslado de|y/gi, '').trim()} (${x[2]||x[3]} años)`).filter(x => x.length > 8).join(', ');

            document.getElementById('rFecha').innerText = `${f} - ${h} hs`;
            document.getElementById('rUbi').innerText = `${d.trim()} ${b ? '(B° ' + b.trim() + ')' : ''}`;
            document.getElementById('rDelito').innerText = `${del.trim()} ${mod ? '[' + mod.trim() + ']' : ''}`;
            document.getElementById('rInvolucrados').innerText = inv || "Ninguno registrado";
        }
    </script>
</body>
</html>
