<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Procesador de Partes Policiales</title>
    <style>
        body { font-family: sans-serif; background: #f8fafc; color: #0f172a; padding: 15px; margin: 0; }
        .container { max-width: 680px; margin: 0 auto; }
        .card { background: white; padding: 15px; border-radius: 8px; border: 1px solid #cbd5e1; margin-bottom: 15px; }
        h2 { font-size: 18px; margin-top: 0; color: #1e3a8a; }
        textarea { width: 100%; height: 180px; padding: 10px; border-radius: 6px; border: 1px solid #94a3b8; box-sizing: border-box; font-size: 14px; }
        button { background: #1e3a8a; color: white; border: none; padding: 12px; border-radius: 6px; width: 100%; font-weight: bold; font-size: 15px; cursor: pointer; }
        button:hover { background: #1e40af; }
        .field { margin-bottom: 10px; background: #f1f5f9; padding: 8px 12px; border-radius: 6px; border-left: 4px solid #1e3a8a; }
        .label { font-size: 11px; font-weight: bold; color: #475569; text-transform: uppercase; }
        .val { font-size: 14px; color: #0f172a; font-weight: bold; margin-top: 2px; white-space: pre-wrap; }
        .val a { color: #2563eb; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Procesador de Partes Policiales</h2>
        
        <div class="card">
            <textarea id="rawInput" placeholder="Pega el parte policial aquí..."></textarea>
            <button onclick="procesarParte()">PROCESAR PARTE</button>
        </div>

        <div class="card">
            <div class="field"><div class="label">Fecha</div><div class="val" id="rFecha">-</div></div>
            <div class="field"><div class="label">Hora</div><div class="val" id="rHora">-</div></div>
            <div class="field"><div class="label">Dirección</div><div class="val" id="rDireccion">-</div></div>
            <div class="field"><div class="label">Barrio</div><div class="val" id="rBarrio">-</div></div>
            <div class="field"><div class="label">Localidad / Ciudad</div><div class="val" id="rLocalidad">-</div></div>
            <div class="field"><div class="label">Geolocalización</div><div class="val" id="rGeo">-</div></div>
            <div class="field"><div class="label">Tipo de Delito / Hecho</div><div class="val" id="rTipoDelito">-</div></div>
            <div class="field"><div class="label">Damnificado</div><div class="val" id="rDamnificado">-</div></div>
            <div class="field"><div class="label">Elementos Sustraídos / Dañados</div><div class="val" id="rSustraidos">-</div></div>
            <div class="field"><div class="label">Aprehendidos / Detenidos</div><div class="val" id="rAprehendidos">-</div></div>
            <div class="field"><div class="label">Elementos Secuestrados</div><div class="val" id="rSecuestrados">-</div></div>
        </div>
    </div>

    <script>
        function extraerCampo(texto, etiquetas) {
            for (let e of etiquetas) {
                let rx = new RegExp(e + "\\s*:\\s*(.*)", "i");
                let m = texto.match(rx);
                if (m && m[1].trim() !== "") {
                    return m[1].trim();
                }
            }
            return "No especifica";
        }

        function procesarParte() {
            try {
                const txt = document.getElementById('rawInput').value;
                if (!txt.trim()) {
                    alert('Por favor pega un parte policial.');
                    return;
                }

                // Extracción por etiquetas exactas o patrones
                let fecha = extraerCampo(txt, ["Fecha"]) ;
                if (fecha === "No especifica") {
                    let mF = txt.match(/(\d{1,2}[\/\.-]\d{1,2}[\/\.-]\d{2,4})/);
                    if (mF) fecha = mF[1];
                }

                let hora = extraerCampo(txt, ["Hora"]);
                if (hora === "No especifica") {
                    let mH = txt.match(/(\d{1,2}[:\.]\d{2})\s*(?:hs|hrs)?/i);
                    if (mH) hora = mH[1] + " hs";
                }

                let direccion = extraerCampo(txt, ["Dirección", "Direccion", "Lugar"]);
                let barrio = extraerCampo(txt, ["Barrio", "B°"]);
                let localidad = extraerCampo(txt, ["Localidad", "Ciudad"]);
                let delito = extraerCampo(txt, ["Tipo de Delito", "Delito", "Hecho"]);
                let damnificado = extraerCampo(txt, ["Damnificado", "Víctima", "Victima"]);
                let sustraidos = extraerCampo(txt, ["Elementos Sustraídos o Dañados", "Elementos Sustraídos", "Sustraídos"]);
                let aprehendidos = extraerCampo(txt, ["Aprehendidos / Detenidos", "Aprehendidos", "Detenidos"]);
                let secuestrados = extraerCampo(txt, ["Elementos Secuestrados", "Secuestrados"]);

                // Georreferenciación
                let geoHtml = "No disponible";
                if (direccion !== "No especifica") {
                    let query = direccion;
                    if (barrio !== "No especifica") query += ", Barrio " + barrio;
                    if (localidad !== "No especifica") query += ", " + localidad;
                    geoHtml = '<a href="https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(query) + '" target="_blank">📍 Ver en Google Maps</a>';
                }

                // Renderizado en pantalla
                document.getElementById('rFecha').innerText = fecha;
                document.getElementById('rHora').innerText = hora;
                document.getElementById('rDireccion').innerText = direccion;
                document.getElementById('rBarrio').innerText = barrio;
                document.getElementById('rLocalidad').innerText = localidad;
                document.getElementById('rGeo').innerHTML = geoHtml;
                document.getElementById('rTipoDelito').innerText = delito;
                document.getElementById('rDamnificado').innerText = damnificado;
                document.getElementById('rSustraidos').innerText = sustraidos;
                document.getElementById('rAprehendidos').innerText = aprehendidos;
                document.getElementById('rSecuestrados').innerText = secuestrados;

            } catch (err) {
                alert('Error al procesar: ' + err.message);
            }
        }
    </script>
</body>
</html>
